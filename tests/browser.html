<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>roundeditor Phase 0 browser fixture</title>
    <link rel="stylesheet" href="../dist/roundeditor.css?v=phase0">
    <script type="module" src="../dist/roundeditor.js?v=phase0"></script>
</head>
<body>
    <form>
        <input type="hidden" name="document_srl" value="123">
        <textarea name="content" hidden>&lt;p&gt;브라우저 테스트&lt;/p&gt;</textarea>
        <div class="roundeditor roundeditor--light"
            data-editor-sequence="7"
            data-editor-config='{"editorSequence":7,"primaryKeyName":"document_srl","contentKeyName":"content","height":300,"focus":false,"contentFont":"inherit","contentFontSize":"15px","contentLineHeight":"1.5","contentWordBreak":"normal","contentParagraphSpacing":"0"}'>
            <div class="roundeditor__loading" role="status">에디터를 불러오는 중입니다.</div>
            <div class="roundeditor__surface"></div>
        </div>
    </form>
</body>
</html>
