<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>roundeditor Phase 4 browser fixture</title>
    <link rel="stylesheet" href="../dist/roundeditor.css?v=phase4">
    <script type="module" src="../dist/roundeditor.min.js?v=phase4"></script>
</head>
<body>
    <form>
        <input type="hidden" name="document_srl" value="123">
        <textarea name="content" hidden>&lt;p&gt;&lt;img src=&quot;data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==&quot; alt=&quot;브라우저 이미지&quot; width=&quot;240&quot; height=&quot;120&quot; style=&quot;width:240px;height:120px;&quot; data-file-srl=&quot;42&quot; editor_component=&quot;image_link&quot; /&gt;&lt;/p&gt;&lt;p&gt;동영상 위 문단&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;video poster=&quot;data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==&quot; width=&quot;320&quot; height=&quot;180&quot; style=&quot;width:320px;height:180px;display:block;margin-left:auto;margin-right:auto;&quot; controls data-file-srl=&quot;43&quot;&gt;&lt;/video&gt;&lt;p&gt;동영상 아래 문단&lt;/p&gt;</textarea>
        <div class="roundeditor roundeditor--light"
            data-editor-sequence="7"
            data-editor-config='{"editorSequence":7,"primaryKeyName":"document_srl","contentKeyName":"content","height":300,"focus":false,"allowUpload":true,"contentFont":"inherit","contentFontSize":"15px","contentLineHeight":"1.5","contentWordBreak":"normal","contentParagraphSpacing":"0"}'>
            <div class="roundeditor__loading" role="status">에디터를 불러오는 중입니다.</div>
            <div class="roundeditor__surface"></div>
        </div>
    </form>
</body>
</html>
